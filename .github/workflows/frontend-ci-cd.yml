name: Frontend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "**"
      - ".github/workflows/frontend-ci-cd.yml"
  pull_request:
    branches: [main]
    paths:
      - "**"
      - ".github/workflows/frontend-ci-cd.yml"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  packages: read
  id-token: write
  checks: write

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: frontend

jobs:
  lint-build:
    name: 1. Lint and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  image-build-push:
    name: 2. Build and push image
    needs: lint-build
    runs-on: ubuntu-latest
    outputs:
      sha_tag: ${{ steps.image.outputs.sha_tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image variables
        id: image
        shell: bash
        env:
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
        run: |
          if [ -z "$ACR_LOGIN_SERVER" ]; then
            echo "ACR_LOGIN_SERVER repository variable is required" >&2
            exit 1
          fi
          echo "tag=$ACR_LOGIN_SERVER/frontend:${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=$ACR_LOGIN_SERVER/frontend:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Azure login (OIDC)
        if: github.event_name != 'pull_request'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        if: github.event_name != 'pull_request'
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - uses: docker/setup-buildx-action@v3

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.sha_tag }}

  deploy-dev:
    name: 3. Deploy to AKS (dev)
    needs: image-build-push
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: deploy-frontend-dev
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/setup-kubectl@v4

      - name: Get kubeconfig
        run: |
          az aks get-credentials \
            -g "${{ vars.AKS_RESOURCE_GROUP }}" \
            -n "${{ vars.AKS_CLUSTER_NAME }}" \
            --overwrite-existing

      - name: Apply manifests
        run: kubectl apply -f k8s/

      - name: Use this build's image
        run: |
          kubectl set image deployment/frontend \
            frontend=${{ needs.image-build-push.outputs.sha_tag }} \
            -n money-movement

      - name: Wait for rollout
        run: kubectl rollout status deployment/frontend -n money-movement --timeout=180s

      - name: Show pods
        if: always()
        run: kubectl get pods -n money-movement -o wide
